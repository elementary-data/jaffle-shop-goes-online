# This workflow runs the Cursor Agent on a user-provided prompt.
# To use this workflow, you need to set a repository secret named CURSOR_API_KEY.
# You can get your API key from your Cursor settings.
name: Run Cursor Agent

on:
  push:
    branches:
      - cursor-agent-action
      - trying-elementary-mcp
  workflow_dispatch:
    inputs:
      prompt:
        description: 'The prompt for the Cursor Agent to execute.'
        required: true
        default: 'Describe the project in three sentences.'

jobs:
  run-cursor-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cursor Agent
        run: curl https://cursor.com/install -fsS | bash

      - name: create cursor config file
        env:
          ELEMENTARY_BEARER_TOKEN: ${{ secrets.ELEMENTARY_BEARER_TOKEN }}
        run: |
          mkdir -p ~/.cursor
          cat > ~/.cursor/mcp.json <<EOF
          {
            "mcpServers": {
              "elementary-remote": {
                "command": "npx",
                "args": [
                  "-y",
                  "mcp-remote@latest",
                  "https://demo.api.elementary-data.com/mcp/",
                  "--header",
                  "Authorization: ${ELEMENTARY_BEARER_TOKEN}"
                ]
              }
            }
          }
          EOF
          cat << EOF > ~/.cursor/cli-config.json
          {
            "permissions": {
              "allow": [
                "*"
              ],
              "deny": []
            }
          }

          EOF
          
          # Create project-specific MCP approvals
          cat << EOF > ~/.cursor/mcp-approvals.json
          [
            "elementary-remote"
          ]
          EOF

      - name: Verify MCP config
        run: |
          echo "Contents of ~/.cursor/mcp.json:"
          cat ~/.cursor/mcp.json
          echo "---"
          echo "Contents of ~/.cursor/cli-config.json:"
          cat ~/.cursor/cli-config.json
          echo "---"
          echo "Contents of mcp-approvals.json:"
          cat ~/.cursor/mcp-approvals.json
          echo "---"
          ls -la ~/.cursor/
          echo "---"
          ls -la ~/.cursor/projects/ || echo "No projects directory"

      - name: Run Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        # run: cursor-agent "${{ github.event.inputs.prompt || 'Describe the project in three sentences.' }}"
        run: cursor-agent mcp list
