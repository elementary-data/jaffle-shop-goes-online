name: Run multi-day pipeline (keypair)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days-back:
        type: number
        required: false
        default: 8
        description: Number of days to simulate

env:
  DBT_PACKAGE_DEMO_BRANCH_NAME: now-uses-custom-run-started-at
  PROFILE_DIR: ${{ github.workspace }}/jaffle_shop_online

jobs:
  run-multiday-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write dbt profiles
        env:
          PROFILES_YML: ${{ secrets.KEYPAIR_PROFILES_YML }}
        run: |
          echo "$PROFILES_YML" | base64 -d > ${{ env.PROFILE_DIR }}/profiles.yml

      - name: Write Snowflake private key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" | base64 -d > /tmp/snowflake_rsa_key.p8
          chmod 600 /tmp/snowflake_rsa_key.p8

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9.13"

      - name: Install dbt
        run: pip install "dbt-core" "dbt-snowflake"

      - name: Install jaffle shop online project
        run: pip install -e .

      - name: Use custom Elementary branch
        run: |
          sed -i 's/package: elementary-data\/elementary/git: https:\/\/github\.com\/elementary-data\/dbt-data-reliability\.git/' ./jaffle_shop_online/packages.yml
          sed -i '3s/version: [0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*$/revision: ${{ env.DBT_PACKAGE_DEMO_BRANCH_NAME }}/' ./jaffle_shop_online/packages.yml

      - name: Run multi-day pipeline
        run: bash run_pipeline_multiday.sh keypair ${{ inputs.days-back || 8 }}

      - name: Upload generated source CSVs
        uses: actions/upload-artifact@v4
        with:
          name: multiday-pipeline-source-csvs
          path: generated_data
